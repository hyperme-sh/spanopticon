name: Public contact verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['verification/**', 'tests/test_local_verification.py', 'tests/test_operator_delivery.py', 'examples/operator/**', 'profiles/minimum/setup.py', 'profiles/minimum/keycloak_check.py', 'scripts/install_deployment_test_tools.py', '.github/workflows/local-verification.yml']
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_local_verification.py
      - run: python3 -m verification.qualify
      - run: python3 -m unittest discover -s tests -p test_operator_delivery.py
      - run: python3 -m verification.qualify_operator
  keycloak-helm:
    strategy:
      fail-fast: false
      matrix:
        delivery: [local, operator]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install_deployment_test_tools.py --output "$RUNNER_TEMP/verification-tools"
          echo "$RUNNER_TEMP/verification-tools" >> "$GITHUB_PATH"
      - run: bash verification/qualify-helm.sh "${{ matrix.delivery }}"
