name: Feedback intake contracts
on:
  pull_request:
    paths: ['intake/**', '.github/workflows/intake.yml']
  push:
    branches: [main]
    paths: ['intake/**', '.github/workflows/intake.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: intake-contract-admin
          POSTGRES_DB: intake_contract
        ports: ['5432/tcp']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r intake/requirements.lock
      - name: Offline API and PostgreSQL storage contracts
        env:
          INTAKE_CONTRACT_ADMIN_DSN: postgresql://postgres:intake-contract-admin@127.0.0.1:${{ job.services.postgres.ports[5432] }}/intake_contract
          INTAKE_CONTRACT_DSN: postgresql://intake_contract:intake-contract-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/intake_contract
        run: python -m unittest discover -s intake/tests -v
      - name: Build service artifact without publication
        run: docker build -f intake/Dockerfile -t feedback-intake-contract .
