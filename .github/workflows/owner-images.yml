name: Copy qualified owner images to GHCR test
on:
  pull_request:
    paths: ['deployment/owner_image.py', 'scripts/owner_image.py', 'scripts/check_owner_image_runtime.py', 'scripts/qualify_plane_runtime.py', 'fleet/**', '.github/workflows/owner-images.yml', '.github/workflows/owner-image.yml']
  push:
    branches: [main]
    paths: ['deployment/owner_image.py', 'scripts/owner_image.py', 'scripts/check_owner_image_runtime.py', 'scripts/qualify_plane_runtime.py', 'fleet/**', '.github/workflows/owner-images.yml', '.github/workflows/owner-image.yml']
permissions:
  contents: read
  actions: read
jobs:
  owner:
    strategy:
      fail-fast: false
      matrix:
        owner: [hypermesh-gateway, hypermesh-plane]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/owner-image.yml
    with:
      owner: ${{ matrix.owner }}
    secrets:
      OWNER_ARTIFACT_APP_PRIVATE_KEY: ${{ secrets.OWNER_ARTIFACT_APP_PRIVATE_KEY }}
