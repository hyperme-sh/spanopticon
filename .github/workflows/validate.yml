name: Validate templates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/check-version-policy.py
      - run: python3 -m unittest discover -s tests -v
      - name: Verify the reusable workflow executes the tested policy
        run: |
          set -euo pipefail
          policy_ref=7f5b9b21363d41b8f8ed14571195d10f4a11899f
          git fetch --no-tags --depth=1 origin "$policy_ref"
          for path in scripts/component_release.py release/accepted.py release/policy.py; do
            git show "$policy_ref:$path" | cmp - "$path"
          done
      - name: Validate generated Compose configuration
        run: |
          python3 scripts/new_plane.py example --image registry.example.org/team/plane@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --assurance-config examples/assurance/stripe-kyc.json --output "$RUNNER_TEMP/plane-example"
          docker compose -f "$RUNNER_TEMP/plane-example/compose.yaml" config --quiet
      - name: Check and render a synthetic coordinated release
        run: |
          python3 scripts/check_release.py --previous examples/releases/accepted/release.json --candidate examples/releases/candidate/release.json
          python3 scripts/render_release.py --previous examples/releases/accepted/release.json --candidate examples/releases/candidate/release.json --assurance-config examples/assurance/stripe-kyc.json --output "$RUNNER_TEMP/release-example"
          docker compose -f "$RUNNER_TEMP/release-example/api/compose.yaml" config --quiet
          docker compose -f "$RUNNER_TEMP/release-example/worker/compose.yaml" config --quiet
      - name: Validate the template distribution
        run: bash scripts/check-archive.sh
      - name: Retain validated template bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-dist
          path: ${{ env.RELEASE_ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  release-policy-fixture:
    uses: ./.github/workflows/release-policy.yml
    with:
      baseline-ref: ba386cd5fca08d68604a5c992a09c454c1102d4f
      baseline-manifest: examples/releases/accepted/release.json
      candidate-manifest: examples/releases/candidate/release.json
