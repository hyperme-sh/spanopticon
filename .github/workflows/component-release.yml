name: Component development qualification
on:
  workflow_call:
    inputs:
      release-line:
        type: string
        required: true
      baseline-ref:
        description: Optional historical comparison reference; never a prerequisite for development
        type: string
        default: ''
      requested-version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  configuration:
    name: Development versions (not release authorization)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate frozen versions without a prior release
        run: |
          python3 scripts/check-version-policy.py
