name: Component release admission
on:
  workflow_call:
    inputs:
      release-line:
        type: string
        required: true
      baseline-ref:
        description: Trusted repository variable pointing to the accepted-bundle commit
        type: string
        default: ''
      requested-version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  configuration:
    name: Configuration only (not release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-required: ${{ steps.inspect.outputs.release-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: previous-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/spanopticon
          ref: 7f5b9b21363d41b8f8ed14571195d10f4a11899f
          path: policy
          persist-credentials: false
      - id: inspect
        name: Verify stable baseline classification and inspect configuration
        env:
          OWNER_REPOSITORY: ${{ github.repository }}
          RELEASE_LINE: ${{ inputs.release-line }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 policy/scripts/component_release.py --repository-root candidate --repository "$OWNER_REPOSITORY" --line "$RELEASE_LINE" --verify-accepted-record
          python3 policy/scripts/component_release.py --repository-root candidate --previous-source previous-source --repository "$OWNER_REPOSITORY" --line "$RELEASE_LINE" --configuration-only
  admission:
    name: Release compatibility
    needs: configuration
    if: inputs.baseline-ref != '' && (github.event_name != 'pull_request' || needs.configuration.outputs.release-required == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASELINE_REF: ${{ inputs.baseline-ref }}
      OWNER_REPOSITORY: ${{ github.repository }}
      RELEASE_LINE: ${{ inputs.release-line }}
      REQUESTED_VERSION: ${{ inputs.requested-version }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require an accepted baseline before release admission
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['BASELINE_REF']), 'Bootstrap required: set SPANOPTICON_RELEASE_BASELINE_SHA to the reviewed immutable accepted-bundle commit'
          assert os.environ['EVENT_NAME'] == 'pull_request' or os.environ['REQUESTED_VERSION'], 'A release/tag version is required'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline-ref }}
          path: accepted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/spanopticon
          ref: 7f5b9b21363d41b8f8ed14571195d10f4a11899f
          path: policy
          persist-credentials: false
      - name: Check contracts, package versions and the requested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 policy/scripts/component_release.py --repository-root candidate --baseline-root accepted --baseline-ref "$BASELINE_REF" --repository "$OWNER_REPOSITORY" --line "$RELEASE_LINE" --requested-version "$REQUESTED_VERSION"

  initial:
    name: Initial release admission
    needs: configuration
    if: inputs.baseline-ref == '' && (github.event_name != 'pull_request' || needs.configuration.outputs.release-required == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/spanopticon
          ref: 7f5b9b21363d41b8f8ed14571195d10f4a11899f
          path: policy
          persist-credentials: false
      - name: Validate first declaration and absence of stable history
        env:
          OWNER_REPOSITORY: ${{ github.repository }}
          RELEASE_LINE: ${{ inputs.release-line }}
          REQUESTED_VERSION: ${{ inputs.requested-version }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" != pull_request && -z "$REQUESTED_VERSION" ]]; then
            echo 'A release/tag version is required' >&2
            exit 1
          fi
          python3 policy/scripts/component_release.py --repository-root candidate --repository "$OWNER_REPOSITORY" --line "$RELEASE_LINE" --requested-version "$REQUESTED_VERSION" --initial-release
