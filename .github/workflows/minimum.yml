name: Minimum template contracts
on:
  pull_request:
    paths: ['profiles/minimum/**', 'scripts/service_channels.py', 'scripts/check_channel_templates.py', '.github/workflows/minimum.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 scripts/install_deployment_test_tools.py --output "$RUNNER_TEMP/channel-tools"
          echo "$RUNNER_TEMP/channel-tools" >> "$GITHUB_PATH"
      - run: python3 scripts/check_channel_templates.py
