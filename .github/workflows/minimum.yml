name: Minimum public bundle
on:
  workflow_dispatch:
  pull_request:
    paths: ['profiles/minimum/**', 'examples/operator/identity.py', 'examples/operator/common.py', 'examples/operator/requirements.lock', 'scripts/install_deployment_test_tools.py', '.github/workflows/minimum.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [compose, helm]
        issuer: [local, keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: matrix.engine == 'helm'
        run: |
          python3 scripts/install_deployment_test_tools.py --output "$RUNNER_TEMP/minimum-tools"
          echo "$RUNNER_TEMP/minimum-tools" >> "$GITHUB_PATH"
      - run: bash profiles/minimum/qualify.sh "${{ matrix.engine }}" "${{ matrix.issuer }}"
