name: Peer settings consumer contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, linux, x64, debrunner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: fixture
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: plane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/plane
          ref: 50ab032a97eecddb782385e0173992674e3d6267
          token: ${{ steps.fixture.outputs.token }}
          path: .plane-contract
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - run: uv run --isolated --no-project --with cryptography==50.0.2 python -m unittest tests.test_plane_policy_contract -v
        env:
          PLANE_POLICY_SOURCE: .plane-contract/products/hypermesh/src/hypermesh_service/peer_handshake.py
