name: Verify and copy one owner test image
on:
  workflow_call:
    inputs:
      owner:
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  verify:
    permissions:
      contents: read
      packages: read
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      OWNER: ${{ inputs.owner }}
    steps:
      - name: Validate fixed owner selection
        run: |
          case "$OWNER" in hypermesh-gateway|hypermesh-plane) ;; *) echo 'Unsupported image owner'; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@a379033aa3ed13ed621cce74930b7ef01ec4f743
        with:
          version: 1.3.0
      - name: Pull pinned GHCR image and verify its OCI graph
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/registry.XXXXXX")
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/owner_image.py download --pin "fleet/owner-images/$OWNER.json" --directory "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
      - name: Exercise the real gateway Compose runtime
        if: inputs.owner == 'hypermesh-gateway'
        run: python3 scripts/check_owner_image_runtime.py --directory "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
      - name: Install pinned plane qualification tools
        if: inputs.owner == 'hypermesh-plane'
        run: |
          python3 scripts/install_deployment_test_tools.py --output "$RUNNER_TEMP/plane-tools"
          echo "$RUNNER_TEMP/plane-tools" >> "$GITHUB_PATH"
      - name: Qualify real plane Compose and Helm database startup
        if: inputs.owner == 'hypermesh-plane'
        run: |
          python3 scripts/qualify_plane_runtime.py --engine compose --directory "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
          python3 scripts/qualify_plane_runtime.py --engine helm --directory "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
      - name: Clean job-owned image files and credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP"/registry.* ]]; then rm -rf -- "$DOCKER_CONFIG"; fi
  publish:
    needs: verify
    if: github.repository == 'hyperme-sh/spanopticon' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    concurrency:
      group: spanopticon-owner-test-images-${{ inputs.owner }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ inputs.owner }}
    steps:
      - name: Validate fixed owner selection
        run: |
          case "$OWNER" in hypermesh-gateway|hypermesh-plane) ;; *) echo 'Unsupported image owner'; exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@a379033aa3ed13ed621cce74930b7ef01ec4f743
        with:
          version: 1.3.0
      - name: Pull pinned GHCR image and verify its OCI graph
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/registry.XXXXXX")
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/owner_image.py download --pin "fleet/owner-images/$OWNER.json" --directory "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
      - name: Copy and read back exact test image bytes
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/owner_image.py publish --pin "fleet/owner-images/$OWNER.json" --directory "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
      - name: Record registry publication
        run: cat "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER/publication.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean job-owned image files and credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/owner-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$OWNER"
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP"/registry.* ]]; then rm -rf -- "$DOCKER_CONFIG"; fi
