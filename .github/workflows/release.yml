name: Package release channels
on:
  workflow_run:
    workflows: ["Validate templates"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: package-release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      actions: read
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on:
      group: shared-local
      labels: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Publish or promote exact tested artifacts
        uses: hyperme-sh/.github/actions/release-channel@45b5987d7000ab44bddc4e5ec3a0ff7674d3b137
        with:
          workflow: .github/workflows/validate.yml
          token: ${{ github.token }}
