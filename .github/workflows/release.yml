name: Package release channels
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: package-release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      actions: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish or promote exact tested artifacts
        uses: hyperme-sh/.github/actions/release-channel@ecea1374b9d382d790dc13768a77678bbf33c432
        with:
          workflow: .github/workflows/validate.yml
          token: ${{ github.token }}
