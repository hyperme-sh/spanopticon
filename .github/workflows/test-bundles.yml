name: Test bundles
on:
  workflow_run:
    workflows: [Validate templates]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      gold_test:
        description: Exact test bundle to copy unchanged to the declared next version
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: versioned-test-bundles
  cancel-in-progress: false
jobs:
  bundle:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish qualified test or explicitly selected gold bundle
        uses: hyperme-sh/.github/actions/bundle-channel@141019b0e52f814b80223e0e8d3ced26a9111b9b
        with:
          mode: ${{ github.event_name == 'workflow_run' && 'test' || 'promote' }}
          token: ${{ github.token }}
