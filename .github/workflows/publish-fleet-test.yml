name: Publish qualified fleet test bundle
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: >-
      github.repository == 'hyperme-sh/spanopticon' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'hyperme-sh/spanopticon/.github/workflows/qualify-fleet.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: spanopticon-fleet-test-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fleet-test-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-test-bundle
      - uses: oras-project/setup-oras@a379033aa3ed13ed621cce74930b7ef01ec4f743
        with:
          version: 1.3.0
      - name: Publish and read back qualified test bytes
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_fleet_test.py --artifact "$RUNNER_TEMP/fleet-test-bundle" --receipt "$RUNNER_TEMP/fleet-publication.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-test-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-publication.json
          if-no-files-found: error
          retention-days: 90
