services:
  api:
    environment:
      VERIFICATION_DELIVERY_MODE: operator
      VERIFICATION_RECIPIENT_DOMAINS: ${VERIFICATION_RECIPIENT_DOMAINS:-}
      VERIFICATION_LIMIT_SUBJECT: ${VERIFICATION_LIMIT_SUBJECT:-10}
      VERIFICATION_LIMIT_RECIPIENT: ${VERIFICATION_LIMIT_RECIPIENT:-3}
      VERIFICATION_LIMIT_OPERATOR: ${VERIFICATION_LIMIT_OPERATOR:-100}
  worker:
    environment:
      VERIFICATION_DELIVERY_MODE: operator
      VERIFICATION_ADAPTER_SOCKET: /adapter/delivery.sock
    volumes:
      - ${VERIFICATION_ADAPTER_DIRECTORY:?Mount a trusted adapter directory}:/adapter:ro
